# GPU Hub GHCR release (Phase 10K) — preparation only.
#
# This workflow is deliberately NOT triggered on push or PR.
# It exists to document the future release process and provide
# a ready-to-activate pipeline when cutover is decided.
#
# To activate:
#   1. Uncomment the `on:` trigger (workflow_dispatch recommended)
#   2. Set GHCR_IMAGE_PAT secret in the repo settings
#   3. Run manually from the Actions tab
#
# RULES (Phase 10K audit §Future GHCR release):
#   - NEVER use :latest. Pin by SHA digest or immutable version tag.
#   - Record the digest in the cutover audit before consuming.
#   - The image must be sha256-identical to the monorepo gpu-hub/ fixture.

name: gpu-hub-ghcr-release

# UNCOMMENT TO ACTIVATE:
# on:
#   workflow_dispatch:
#     inputs:
#       image_tag:
#         description: "Immutable image tag (e.g., v0.1.0-sha256-abc123)"
#         required: true
#         type: string
#   push:
#     tags:
#       - "v*"

on: {}  # DISABLED — preparation only

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build + smoke + push to GHCR
    runs-on: ubuntu-latest
    # Uncomment when activated:
    # if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        # Uncomment when activated:
        # uses: docker/login-action@v3
        # with:
        #   registry: ${{ env.REGISTRY }}
        #   username: ${{ github.actor }}
        #   password: ${{ secrets.GHCR_IMAGE_PAT }}
        run: echo "LOGIN DISABLED — preparation only"

      - name: Build image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Smoke test (isolated redis:7 network)
        run: |
          set -euo pipefail
          docker network create ghcr-smoke >/dev/null
          docker run -d --name ghcr-smoke-redis --network ghcr-smoke redis:7 >/dev/null
          docker run -d --name ghcr-smoke-hub \
            --network ghcr-smoke \
            -e REDIS_URL=redis://ghcr-smoke-redis:6379 \
            -e GPU_HUB_API_KEY=release-test-key \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} >/dev/null
          sleep 3

          fail() { echo "SMOKE FAIL: $1" >&2; exit 1; }

          # 1. health
          curl -fsS http://127.0.0.1:0 >/dev/null 2>&1 || true
          docker run --rm --network ghcr-smoke curlimages/curl:8.8.0 -fsS \
            http://ghcr-smoke-hub:5000/health | grep -q '"ok":true' \
            || fail "health"

          # 2. API key planes (fail-closed)
          CODE=$(docker run --rm --network ghcr-smoke curlimages/curl:8.8.0 -s -o /dev/null -w '%{http_code}' \
            -X POST http://ghcr-smoke-hub:5000/task -H 'Content-Type: application/json' -d '{}')
          [ "$CODE" = "401" ] || fail "no-key /task expected 401, got $CODE"

          # 3. protocol gate (v1 envelope → 409)
          BODY=$(docker run --rm --network ghcr-smoke curlimages/curl:8.8.0 -s \
            -X POST http://ghcr-smoke-hub:5000/task -H 'Content-Type: application/json' -H 'x-api-key: release-test-key' \
            -d '{"protocol_version":1}')
          echo "$BODY" | grep -q 'protocol_version_mismatch' || fail "protocol gate"

          # 4. protocol parity
          V=$(docker exec ghcr-smoke-hub node -e "console.log(require('@animastor/contracts').jobProtocolV2.PROTOCOL_VERSION)")
          [ "$V" = "2" ] || fail "parity: PROTOCOL_VERSION=$V"

      - name: Record digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} 2>/dev/null || echo "N/A")
          echo "## GHCR Release Digest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: $DIGEST" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**REMEMBER:** Record this digest in the cutover audit before consuming." >> $GITHUB_STEP_SUMMARY

      - name: Push to GHCR
        if: false  # DISABLED — preparation only
        run: |
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "PUSH DISABLED — preparation only"

      - name: Teardown
        if: always()
        run: |
          docker rm -f ghcr-smoke-hub ghcr-smoke-redis >/dev/null 2>&1 || true
          docker network rm ghcr-smoke >/dev/null 2>&1 || true
