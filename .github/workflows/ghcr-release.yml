# GPU Hub GHCR release (Phase 10L) — ACTIVATED.
#
# Reproducible post-split release pipeline:
#   checkout hub → pinned source checkouts (artifacts.lock.json) →
#   stage + verify artifacts (FAIL on any mismatch) → docker build →
#   smoke (protocol/auth gates + artifact gates against the LOCK) →
#   push → record digest + content digest.
#
# The image is built ONLY from this repository plus the immutable commits
# pinned in artifacts.lock.json — never from a floating branch and never from
# a local monorepo checkout. A missing/stale artifact FAILS the run instead of
# shipping a silent baked-in fallback.
#
# RULES (Phase 10K audit §Future GHCR release):
#   - NEVER use :latest. Pin by SHA digest or immutable version tag.
#   - Record the digest in the cutover audit before consuming.
#   - Bumping an artifacts.lock.json pin is a reviewed code change
#     (node scripts/stage-artifacts.cjs --write-lock --worker ... --backend ...).

name: gpu-hub-ghcr-release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: animastor/animastor-gpu-hub

jobs:
  build-and-push:
    name: build + smoke + push to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned artifact sources
        id: pins
        run: |
          PINS=$(node -e '
            const l = JSON.parse(require("fs").readFileSync("artifacts.lock.json", "utf8"));
            const out = [];
            for (const [k, v] of Object.entries(l.sources)) {
              out.push(`${k}_repository=${v.repository}`);
              out.push(`${k}_commit=${v.commit}`);
            }
            for (const [k, v] of Object.entries(l.artifacts)) {
              out.push(`version_${k.replaceAll("-", "_")}=${v.version || ""}`);
              out.push(`tree_${k.replaceAll("-", "_")}=${v.sha256_tree}`);
            }
            console.log(out.join("\n"));
          ')
          echo "$PINS"
          echo "$PINS" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned worker source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.worker_repository }}
          ref: ${{ steps.pins.outputs.worker_commit }}
          path: _sources/worker

      - name: Checkout pinned backend source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.backend_repository }}
          ref: ${{ steps.pins.outputs.backend_commit }}
          path: _sources/backend

      - name: Stage artifacts + verify against lock (FAIL on mismatch)
        run: node scripts/stage-artifacts.cjs --worker _sources/worker --backend _sources/backend

      # The build exports via the `docker` exporter (`type=docker,dest=…tar`)
      # so that `rewrite-timestamp=true` can be applied before `docker load`,
      # and the image is then pushed from the daemon. GH-hosted runners start
      # with the classic overlay2 store; the local reproducibility proofs ran
      # on the containerd image store, so switch it on to keep the load/push
      # path identical (with the plain docker driver the store is also what
      # makes the `type=docker` exporter legal at all).
      - name: Enable containerd image store (push-path parity with local proofs)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo jq '.features = (.features // {}) | .features["containerd-snapshotter"] = true' \
              /etc/docker/daemon.json > /tmp/daemon.json
          else
            printf '{"features":{"containerd-snapshotter":true}}\n' > /tmp/daemon.json
          fi
          sudo cp /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 2
          done
          docker info | grep -F 'io.containerd.snapshotter.v1' \
            || { echo 'containerd image store is NOT active' >&2; exit 1; }

      # The runner's embedded BuildKit serializes image history differently
      # across versions (EXPOSE renders as `map[5000/tcp:{}]` vs
      # `[5000/tcp]`), which changes the image config — and therefore the
      # pushed digest — even for bit-identical layers (verified byte-level:
      # CI embedded BuildKit != local v0.27.1). Pin the engine to the exact
      # image the local reproducibility proofs were built with.
      - name: Create pinned buildx builder (BuildKit v0.27.1)
        run: |
          set -euo pipefail
          docker buildx create --name repro \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.27.1@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368 \
            --use
          docker buildx inspect --bootstrap >/dev/null
          docker buildx version
          docker version --format 'docker server={{.Server.Version}}'

      - name: Build image
        run: |
          EPOCH=$(git log -1 --format=%ct)

          # Pin every mtime of the build context to the commit: COPY keeps the
          # source file mtimes, so a checkout at run time would otherwise bake
          # the wall clock into the COPY layers and change the image digest on
          # every run (verified: same content, different digest).
          find . -path './.git' -prune -o -mindepth 1 -exec touch -h -d "@$EPOCH" {} +

          # Normalize context file modes: the host umask leaks into checkout
          # file modes (0664/0771 with umask 0002 vs 0644/0755 with umask 022)
          # and COPY preserves them, so the same bytes would land in different
          # layer tars on different machines (verified byte-level: mode was
          # the ONLY content difference in the COPY layers). No tracked file
          # carries an exec bit, so 0644/0755 is lossless for the image.
          find . -path './.git' -prune -o -type d -exec chmod 755 {} +
          find . -path './.git' -prune -o -type f -exec chmod 644 {} +

          # Reproducible image build (see DEPLOYMENT.md §4):
          #  - SOURCE_DATE_EPOCH pins the config `created` field and gives
          #    rewrite-timestamp its target value (layer tar mtimes, incl. the
          #    dir mtime COPY writes at build time);
          #  - --provenance=false drops the BuildKit attestation manifest,
          #    which embeds the tag name and wall-clock build time and would
          #    change the pushed index digest even for bit-identical layers;
          #  - output goes to a tar that is then `docker load`ed: the
          #    rewrite-timestamp exporter option conflicts with the daemon's
          #    unpack mode, so --load cannot be used directly.
          # Verified: two independent `--no-cache` builds of one commit yield
          # the same layer diff_ids, the same config digest and the same
          # pushed registry digest.
          docker buildx build \
            --builder repro \
            --no-cache \
            --build-arg SOURCE_DATE_EPOCH=$EPOCH \
            --provenance=false \
            --output type=docker,dest=/tmp/release-image.tar,rewrite-timestamp=true,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} \
            .
          docker load -i /tmp/release-image.tar
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          rm -f /tmp/release-image.tar

      - name: Record image content digest (reproducibility evidence)
        run: |
          docker run --rm --entrypoint node \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            /app/scripts/content-hash.cjs | tee content-hash.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'image content digest (files + sha256 of /app):' >> $GITHUB_STEP_SUMMARY
          echo '`'"$(cat content-hash.txt)"'`' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Smoke test (isolated redis:7 network)
        run: |
          set -euo pipefail
          docker network create ghcr-smoke >/dev/null
          docker run -d --name ghcr-smoke-redis --network ghcr-smoke redis:7 >/dev/null
          docker run -d --name ghcr-smoke-hub \
            --network ghcr-smoke \
            -e REDIS_URL=redis://ghcr-smoke-redis:6379 \
            -e GPU_HUB_API_KEY=release-test-key \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} >/dev/null
          sleep 3

          fail() { echo "SMOKE FAIL: $1" >&2; exit 1; }

          # 1. health
          docker run --rm --network ghcr-smoke curlimages/curl:8.8.0 -fsS \
            http://ghcr-smoke-hub:5000/health | grep -q '"gpus":' \
            || fail "health"

          # 2. API key planes (fail-closed)
          CODE=$(docker run --rm --network ghcr-smoke curlimages/curl:8.8.0 -s -o /dev/null -w '%{http_code}' \
            -X POST http://ghcr-smoke-hub:5000/task -H 'Content-Type: application/json' -d '{}')
          [ "$CODE" = "401" ] || fail "no-key /task expected 401, got $CODE"

          # 3. protocol gate (v1 envelope → 409)
          BODY=$(docker run --rm --network ghcr-smoke curlimages/curl:8.8.0 -s \
            -X POST http://ghcr-smoke-hub:5000/task -H 'Content-Type: application/json' -H 'x-api-key: release-test-key' \
            -d '{"protocol_version":1}')
          echo "$BODY" | grep -q 'protocol_version_mismatch' || fail "protocol gate"

          # 4. protocol parity
          V=$(docker exec ghcr-smoke-hub node -e "console.log(require('@animastor/contracts').jobProtocolV2.PROTOCOL_VERSION)")
          [ "$V" = "2" ] || fail "parity: PROTOCOL_VERSION=$V"

          # 5. baked resolution path (no mounts in this container)
          LOGS=$(docker logs ghcr-smoke-hub 2>&1)
          BAKED=$(echo "$LOGS" | grep -c '(baked-in)' || true)
          [ "$BAKED" -ge 5 ] || fail "expected >=5 [ARTIFACTS] (baked-in) resolutions, got $BAKED"
          if echo "$LOGS" | grep -q '(mount)'; then fail "unexpected (mount) resolution without mounts"; fi

          # 6. served artifacts must equal artifacts.lock.json (anti silent-fallback)
          docker exec ghcr-smoke-hub node /app/scripts/smoke-artifacts.cjs \
            || fail "artifact lock assertions (worker/workflow/installer)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_IMAGE_PAT }}

      - name: Push to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Record digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} 2>/dev/null || echo "N/A")
          echo "## GHCR Release Digest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: $DIGEST" >> $GITHUB_STEP_SUMMARY
          echo "Content: $(cat content-hash.txt)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**REMEMBER:** Record this digest in the cutover audit before consuming." >> $GITHUB_STEP_SUMMARY

      - name: Teardown
        if: always()
        run: |
          docker rm -f ghcr-smoke-hub ghcr-smoke-redis >/dev/null 2>&1 || true
          docker network rm ghcr-smoke >/dev/null 2>&1 || true
